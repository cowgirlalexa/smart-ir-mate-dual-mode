# XIAO Smart IR Mate: Seeed stored-signal controls + native ESPHome IR proxy
# Sources:
# https://github.com/Seeed-Studio/xiao-esphome-projects/blob/main/projects/xiao_smart_ir_mate/xiao_smart_ir_mate.yaml
# https://github.com/esphome/infrared-proxies/blob/main/xiao-ir-mate/xiao-ir-mate.yaml
# Field-tested by project maintainer on the XIAO Smart IR Mate (November 2026).
# Configure your own secrets.yaml before flashing.

esphome:
  name: irproxy-sb
  friendly_name: IRProxy-SB
  # Enable if running multiple devices using this same YAML:
  # name_add_mac_suffix: true
  project:
    name: xiao.smart-ir-mate
    version: '2.0'

esp32:
  board: seeed_xiao_esp32c3
  # Seeed's Flash_comp external component originally uses Arduino.
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret ir_proxy_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: set for VPN/mDNS environments; otherwise omit to use normal discovery.
  # use_address: 192.168.1.100
  on_connect:
    - globals.set:
        id: is_wifi_connected
        value: 'true'
    - light.turn_on: rgb_light
    - lambda: |-
        auto ips = ::esphome::wifi::global_wifi_component->wifi_sta_ip_addresses();
        if (!ips.empty() && ips[0].is_set()) {
          char ip_buf[46];
          ESP_LOGI("ir", "IP address: %s", ips[0].str_to(ip_buf));
        } else {
          ESP_LOGI("ir", "IP address: not yet assigned");
        }
  on_disconnect:
    - globals.set:
        id: is_wifi_connected
        value: 'false'
  ap:
    ssid: IRProxy-SB Fallback Hotspot
    password: !secret ir_proxy_fallback_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Seeed-Studio/xiao-esphome-projects
      ref: main
    components: [Flash_comp]

Flash_comp:
  id: signal_nvs

globals:
  - id: is_wifi_connected
    type: bool
    initial_value: 'false'
  - id: reset_press_time
    type: uint32_t
    initial_value: '0'
  - id: touch_timer
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: is_learning_mode
    type: bool
    initial_value: 'false'
  - id: signal_select_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: send_data_vector
    type: std::vector<long int>
    restore_value: no
  - id: filter_size
    type: int
    initial_value: '10'

# A SINGLE transmitter and receiver are shared by the Seeed learning feature
# and the native Home Assistant infrared proxy.
remote_transmitter:
  id: my_transmitter
  pin: GPIO3
  non_blocking: true
  carrier_duty_percent: 50%

remote_receiver:
  - id: rcvr
    pin:
      number: GPIO4
      inverted: true
    idle: 65500us
    clock_resolution: '500000'
    on_raw:
      - switch.turn_off: vibration_switch
      - lambda: |-
          if (id(is_learning_mode)) {
            if (x.size() > id(filter_size)) {
              ESP_LOGI("ir", "Saved signal index: %d", id(signal_select_index));
              id(signal_nvs).save_to_nvs(id(signal_select_index), x);
              id(send_data_vector).clear();
              id(send_data_vector) = id(signal_nvs).load_from_nvs<long int>(id(signal_select_index));
              id(is_learning_mode) = false;
              id(is_learned_signal_script).execute(true);
            }
          }

# Native Home Assistant infrared entities (IR/RF Proxy).
infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_tx
    remote_transmitter_id: my_transmitter
  - platform: ir_rf_proxy
    name: IR Proxy Receiver
    id: ir_proxy_rx
    remote_receiver_id: rcvr

button:
  - platform: template
    id: learn
    name: Learn
    on_press:
      - switch.turn_on: vibration_switch
      - lambda: |-
          id(is_learning_mode) = true;
          ESP_LOGI("ir", "Learning mode activated!");
  - platform: template
    id: transmit
    name: Send
    on_press:
      - lambda: |-
          if (id(send_data_vector).size() > 0) {
            id(send_raw).execute();
            ESP_LOGI("ir", "Sending signal index: %d", id(signal_select_index));
            ESP_LOGI("ir", "Sending signal size: %d", id(send_data_vector).size());
          } else {
            ESP_LOGI("ir", "Signal index %d not learned", id(signal_select_index));
          }
  - platform: restart
    name: Restart
    entity_category: config
    disabled_by_default: true

select:
  - platform: template
    name: signal_select
    id: signal_select
    options:
      - Signal0
      - Signal1
      - Signal2
      - Signal3
      - Signal4
      - Signal5
      - Signal6
      - Signal7
      - Signal8
      - Signal9
    initial_option: Signal0
    optimistic: true
    on_value:
      - lambda: |-
          id(signal_select_index) = i;
          ESP_LOGI("ir", "Current selected signal index: %d", i);
          id(send_data_vector).clear();
          id(send_data_vector) = id(signal_nvs).load_from_nvs<long int>(id(signal_select_index));
          if (id(send_data_vector).size() > 0) {
            id(is_learned_signal_script).execute(true);
          } else {
            id(is_learned_signal_script).execute(false);
          }

switch:
  - platform: output
    id: vibration_switch
    name: Vibration device
    output: vibration_output
  - platform: factory_reset
    id: factory_switch
    name: Restart with Factory Default Settings
  - platform: template
    id: is_learned_signal_switch
    name: Is Learned Signal?
    optimistic: true

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO7
    num_leds: 1
    chipset: WS2812
    name: WIFI RGB Light
    id: rgb_light
    rmt_symbols: 48

binary_sensor:
  - platform: gpio
    id: touch_pad
    pin:
      number: GPIO5
      mode: INPUT_PULLDOWN
    on_state:
      then:
        - lambda: |-
            id(vibe).execute(100);
            id(touch_timer) = millis();
            if (id(check_touch_delay).is_running()) {
              id(check_touch_delay).stop();
              delay(10);
            }
            id(check_touch_delay).execute();
  - platform: gpio
    id: reset_button
    pin:
      number: GPIO9
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
    filters:
      - invert:
    on_press:
      then:
        - lambda: |-
            id(reset_press_time) = millis();
    on_release:
      then:
        - lambda: |-
            uint32_t press_duration = millis() - id(reset_press_time);
            if (press_duration < 5000) {
              id(vibe).execute(100);
              ESP_LOGI("ir", "Restart Device");
              ESP.restart();
            } else {
              for (int i = 0; i < 10; i++) {
                id(signal_nvs).clear_signal_by_index(i);
              }
              ESP_LOGI("ir", "Restart with Factory Default Settings");
              id(vibe).execute(500);
              id(factory_switch).turn_on();
            }

output:
  - platform: gpio
    id: vibration_output
    pin: GPIO6

script:
  - id: vibe
    parameters:
      delay_ms: int
    then:
      - switch.turn_on: vibration_switch
      - delay: !lambda return delay_ms;
      - switch.turn_off: vibration_switch
  - id: check_touch_delay
    then:
      - delay: 300ms
      - lambda: |-
          unsigned long current_time = millis();
          if (current_time - id(touch_timer) >= 300) {
            ESP_LOGI("check click", "single click action");
            id(transmit).press();
          }
  - id: send_raw
    then:
      - remote_transmitter.transmit_raw:
          code: !lambda return id(send_data_vector);
          carrier_frequency: 38000Hz
          repeat: 1
  - id: is_learned_signal_script
    parameters:
      is_learned_signal: bool
    then:
      - lambda: |-
          if (is_learned_signal) {
            id(is_learned_signal_switch).turn_on();
          } else {
            id(is_learned_signal_switch).turn_off();
          }

interval:
  - id: blink_rgb
    interval: 500ms
    then:
      - lambda: |-
          if (!id(is_wifi_connected)) {
            static int state = 0;
            if (state == 1) {
              auto call = id(rgb_light).turn_on();
              call.set_rgb(1.0, 1.0, 1.0);
              call.set_transition_length(0);
              call.perform();
            } else {
              auto call = id(rgb_light).turn_off();
              call.set_transition_length(0);
              call.perform();
            }
            state = !state;
          }
