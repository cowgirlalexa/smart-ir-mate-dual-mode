# Copy values to ESPHome's secrets.yaml (do not commit secrets.yaml).
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# Generate an ESPHome API encryption key in ESPHome Device Builder.
ir_proxy_api_key: "YOUR_BASE64_32_BYTE_API_KEY"
# At least 8 characters for the fallback access point.
ir_proxy_fallback_password: "CHANGE_THIS_PASSWORD"
